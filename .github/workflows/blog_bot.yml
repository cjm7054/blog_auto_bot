name: Blog Auto Bot Daily Run

on:
  schedule:
    # 깃허브 서버 대기 지연(약 20~30분)을 감안하여 실제 피크타임 30분 전으로 스케줄링
    - cron: '30 22 * * *' # 아침 출근 피크 (KST 07:30 스케줄 -> 실제 발행 08:00 경)
    - cron: '30 2 * * *'  # 점심 시간 피크 (KST 11:30 스케줄 -> 실제 발행 12:00 경)
    - cron: '30 11 * * *' # 저녁 휴식 피크 (KST 20:30 스케줄 -> 실제 발행 21:00 경)
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Prepare Secrets and Credentials
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo '${{ secrets.GCP_CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.GCP_TOKEN_JSON }}' > token.json
          
      - name: Run Blog Auto Bot
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python main.py
